spring.application.name=barber

# Conexão com o Banco de Dados
spring.datasource.url=jdbc:mysql://localhost:3307/${MYSQL_DATABASE:}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bahia
spring.datasource.username=${MYSQL_USER:}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurações de Segurança
api.security.token.secret=${JWT_SECRET}
api.security.admin.login=${ADMIN_LOGIN}
api.security.admin.password=${ADMIN_PASSWORD}

# ===================================================================
# CONFIGURAÇÃO DO FLYWAY
# ===================================================================
# Ativa a execução automática das migrações ao iniciar a aplicação
spring.flyway.enabled=true

# Diretório padrão onde ficarão as migrations
spring.flyway.locations=classpath:db/migration

# Garante que o Flyway rode antes do Hibernate validar o esquema
spring.jpa.hibernate.ddl-auto=validate